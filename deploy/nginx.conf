# ==============================================================================
# Recraftr Production Nginx Configuration
# ==============================================================================
# Reverse proxy for FastAPI backend with SSL, security headers, rate limiting,
# and buffer disabling for Server-Sent Events (SSE) AI streaming endpoints.
# ==============================================================================

# Upstream FastAPI application managed by systemd (Uvicorn workers)
upstream recraftr_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

# Rate limit zone: 100 requests per second burst per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# ------------------------------------------------------------------------------
# 1. HTTP Server — Redirect all unencrypted traffic to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name recraftr.com api.recraftr.com;

    # Let's Encrypt / Certbot challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Strict 301 Permanent Redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server — API Reverse Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.recraftr.com;

    # SSL Certificates (managed by Certbot or custom path)
    ssl_certificate /etc/letsencrypt/live/api.recraftr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.recraftr.com/privkey.pem;

    # SSL Hardening (A+ Qualys SSL Labs configuration)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Request Size Limits (10MB ceiling matching backend RequestSizeLimitMiddleware)
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Security Headers (Defense in depth, aligned with backend SecurityHeadersMiddleware)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Gzip Compression for JSON/text responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Timeouts
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 65s;

    # Logs
    access_log /var/log/nginx/recraftr_api_access.log;
    error_log /var/log/nginx/recraftr_api_error.log warn;

    # --------------------------------------------------------------------------
    # AI Streaming Endpoints: Disable proxy buffering for low-latency SSE
    # --------------------------------------------------------------------------
    location ~* ^/api/(analyze-stream|optimize-stream|auto-optimize-stream|cover-letter-stream)$ {
        proxy_pass http://recraftr_backend;
        proxy_http_version 1.1;

        # Disable buffering and enable chunked transfers for immediate token delivery
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Streaming AI queries can take up to 3-5 minutes
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # --------------------------------------------------------------------------
    # General API endpoints & Health/Readiness checks
    # --------------------------------------------------------------------------
    location / {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://recraftr_backend;
        proxy_http_version 1.1;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
